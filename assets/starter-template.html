<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Simulation</title>
<style>
:root{
  --ink:#1f2f3d; --mut:#4b5b66; --line:#d7dcd9; --acc:#2f6f8f; --warm:#b8503a;
  --ok:#27ae60; --bg:#f5f6f4; --bench:#f0f4f7; --bench-2:#e8eff2; --panel:#fff;
  --sidebar-w:clamp(260px,30vw,320px);
  --player-safe-top:64px;
  --bench-safe-top:70px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:'IBM Plex Sans Arabic','Montserrat',-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}
#app{display:flex;flex-direction:row;width:100%;height:100vh;height:100dvh;overflow:hidden}
#app.panel-open #bench-stage{margin-right:min(var(--sidebar-w),88vw)}
#sidebar{position:fixed;inset-block:0;right:0;width:min(var(--sidebar-w),88vw);height:100%;
  background:var(--panel);border-inline-end:1px solid var(--line);box-shadow:0 0 24px rgba(31,47,61,.12);
  display:flex;flex-direction:column;z-index:30;transform:translateX(105%);visibility:hidden;
  transition:transform .24s ease,visibility .24s}
#sidebar.open{transform:translateX(0);visibility:visible}
#bench-stage{transition:margin .24s ease}
.sb-head{position:relative;padding:calc(var(--player-safe-top) + 12px) 20px 12px;flex:0 0 auto}
.collapse-tab{position:fixed;top:50%;right:min(var(--sidebar-w),88vw);transform:translateY(-50%);
  width:36px;height:56px;display:grid;place-items:center;padding:0;border:1px solid var(--line);
  border-right:0;border-radius:12px 0 0 12px;background:var(--panel);color:var(--acc);
  box-shadow:-4px 2px 12px rgba(31,47,61,.12);cursor:pointer}
.collapse-tab svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.collapse-tab:hover{background:#f3f8fa;color:#245a75}
.collapse-tab:focus-visible{outline:3px solid rgba(47,111,143,.3);outline-offset:2px}
.sb-head h1{margin:0 0 4px;font-size:18px;line-height:1.35}
.sb-head p{margin:0;font-size:13px;color:var(--mut);line-height:1.5}
.sb-scroll{direction:ltr;flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 20px;
  display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;scrollbar-width:thin;
  scrollbar-color:transparent transparent}
#sidebar.scrolling .sb-scroll{scrollbar-color:rgba(75,91,102,.6) transparent}
.sb-scroll::-webkit-scrollbar{width:7px}
.sb-scroll::-webkit-scrollbar-track{background:transparent}
.sb-scroll::-webkit-scrollbar-thumb{border-radius:99px;background:transparent}
#sidebar.scrolling .sb-scroll::-webkit-scrollbar-thumb{background:rgba(75,91,102,.6)}
.sb-foot{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:8px 14px 12px;
  border-top:1px solid var(--line);background:var(--panel)}
.icon-btn{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;
  padding:0;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--mut);cursor:pointer}
.icon-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
#rst:hover{border-color:var(--acc);background:#f3f8fa;color:var(--acc)}
#next{border-color:var(--acc);background:var(--acc);color:#fff;box-shadow:0 2px 5px rgba(47,111,143,.2)}
#next:hover{background:#245a75}
.icon-btn:focus-visible{outline:3px solid rgba(47,111,143,.3);outline-offset:2px}
.icon-btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.progress{flex:1 1 auto;min-width:0;display:grid;gap:5px}
.progress-label{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--mut)}
.progress-label strong{font-weight:700;color:var(--ink);direction:ltr}
.progress-track{height:4px;overflow:hidden;border-radius:99px;background:#e8edef}
.progress-fill{width:0;height:100%;border-radius:inherit;background:var(--acc);transition:width .2s ease}
#steps{direction:rtl;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
#steps li{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;padding:6px 8px;margin-inline:-8px;
  border:1px solid transparent;border-radius:9px;font-size:13px;color:var(--mut);line-height:1.5;
  transition:background-color .18s,border-color .18s}
#steps li .box{flex:0 0 18px;height:18px;border:1.5px solid var(--line);border-radius:5px;display:grid;place-items:center;font-size:12px;color:#fff;margin-top:1px}
#steps li.done{color:var(--ink)} #steps li.done .box{background:var(--ok);border-color:var(--ok)}
#steps li.cur{color:var(--ink);font-weight:600;background:#eaf4f8;border-color:#c9e0ea;
  box-shadow:inset -3px 0 0 var(--acc)}
#steps li.cur .box{border-color:var(--acc)}
.step-hint{flex:0 0 calc(100% - 28px);margin-inline-start:28px;color:var(--warm);font-size:12px;font-weight:400}
.steps-done{padding:8px 0;color:var(--ok);font-size:14px;font-weight:700}
#bench-stage{flex:1 1 auto;min-width:0;height:100%;position:relative;background:var(--bench)}
#bench{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#tool-tooltip{position:absolute;z-index:5;max-width:min(180px,70%);padding:6px 10px;
  border:1px solid rgba(47,111,143,.28);border-radius:8px;background:rgba(255,255,255,.96);
  color:var(--ink);font-size:13px;font-weight:600;line-height:1.35;white-space:nowrap;
  box-shadow:0 3px 10px rgba(31,47,61,.14);pointer-events:none;opacity:0;visibility:hidden;
  transition:opacity .12s ease}
#tool-tooltip.visible{opacity:1;visibility:visible}
 .panel-toggle{position:fixed;z-index:20;inset-block-start:50%;right:14px;transform:translateY(-50%);
  width:44px;height:44px;border:1px solid rgba(47,111,143,.25);border-radius:14px;background:#fff;
  color:var(--acc);box-shadow:0 4px 16px rgba(31,47,61,.16);display:grid;place-items:center;cursor:pointer}
.panel-toggle svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.panel-toggle[aria-expanded="true"]{opacity:0;visibility:hidden}
.panel-toggle:focus-visible{outline:3px solid rgba(47,111,143,.3);outline-offset:3px}
@media (prefers-reduced-motion:reduce){
  #sidebar,#bench-stage,#tool-tooltip{transition:none}
  .sb-scroll{scroll-behavior:auto}
}
@media (max-width:760px) and (orientation:portrait){
  #app{flex-direction:column}
  #app.panel-open #bench-stage{margin:0 0 min(38dvh,380px)}
  #sidebar{inset:auto 0 0;width:100%;height:min(38dvh,380px);max-height:min(38dvh,380px);
    transform:translateY(105%);border-inline:0;border-top:1px solid var(--line)}
  #sidebar.open{transform:translateY(0)}
  .sb-head{padding:10px 16px 6px}.sb-scroll{padding:0 16px 8px}
  .sb-foot{gap:10px;padding:7px 16px 10px}
  .collapse-tab{position:absolute;top:0;right:auto;left:50%;transform:translate(-50%,-100%);
    width:56px;height:36px;border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0}
  .collapse-tab svg{transform:rotate(-90deg)}
  .panel-toggle{top:auto;right:auto;bottom:14px;left:50%;transform:translateX(-50%);
    width:44px;height:44px;border-radius:14px}
}
</style>
</head>
<body>
<div id="app" class="panel-open">
  <aside id="sidebar" class="open" aria-hidden="false">
    <div class="sb-head">
      <button id="collapse-panel" class="collapse-tab" type="button" aria-label="طي قائمة الخطوات" title="طي القائمة">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 18-6-6 6-6"/></svg>
      </button>
      <h1 id="exp-title"></h1><p id="exp-sub"></p>
    </div>
    <div class="sb-scroll">
      <ol id="steps" aria-label="تعليمات خطوات التجربة"></ol>
    </div>
    <footer class="sb-foot">
      <button id="rst" class="icon-btn" type="button" aria-label="إعادة التجربة" title="إعادة التجربة">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.6 6.4"/><path d="M3 4v7h7"/></svg>
      </button>
      <div class="progress" role="progressbar" aria-label="تقدم التجربة" aria-valuemin="0" aria-valuemax="2" aria-valuenow="0">
        <div class="progress-label"><span>التقدم</span><strong id="progress-count">1 / 2</strong></div>
        <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
      <button id="next" class="icon-btn" type="button" aria-label="الخطوة التالية" title="الخطوة التالية">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg>
      </button>
    </footer>
  </aside>
  <main id="bench-stage"><canvas id="bench" tabindex="0"></canvas><div id="tool-tooltip" role="tooltip" aria-hidden="true"></div></main>
</div>
<button id="open-panel" class="panel-toggle" type="button" aria-label="إظهار قائمة الخطوات"
  aria-controls="sidebar" aria-expanded="true" title="إظهار قائمة الخطوات">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
</button>

<script>
/* ===== DRAWKIT:BEGIN (v2) — مكتبة الرسم المتجهية الموحدة =====
   كل جهاز: Kit.<name>(g, x, y, s, opts)
   - (x, y) = نقطة الإمساك/الاستقرار (انظر الجدول في drawing-standards.md)
   - s = مقياس (استخدم U من القالب)
   - الضوء من أعلى اليسار دائماً. لا تعدّل الألوان خارج Kit.pal.
   ES5 فقط. يحتاج ctx.roundRect (polyfill موجود في القالب).               */
var Kit = (function () {
  var K = {}, TAU = Math.PI * 2;
  K.pal = { ink: '#1f2f3d', acc: '#2f6f8f', warm: '#b8503a', ok: '#27ae60',
            ivory: [236, 238, 235], graphite: [48, 60, 70], steel: [168, 178, 186],
            glassEdge: 'rgba(104,140,160,.95)' };

  /* ───── أدوات اللون ───── */
  function c255(v) { return Math.max(0, Math.min(255, Math.round(v))); }
  function shade(c, k) { return [c255(c[0] * k), c255(c[1] * k), c255(c[2] * k)]; }
  function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  function lg(g, x0, y0, x1, y1, stops) {
    var gr = g.createLinearGradient(x0, y0, x1, y1);
    stops.forEach(function (s) { gr.addColorStop(s[0], s[1]); });
    return gr;
  }
  K.shade = shade; K.rgba = rgba;

  /* ───── ظل التماس: يثبّت الجهاز على الطاولة ───── */
  K.contactShadow = function (g, x, y, w, a) {
    g.save(); g.translate(x, y); g.scale(1, 0.2);
    var r = g.createRadialGradient(0, 0, 0, 0, 0, w / 2);
    r.addColorStop(0, 'rgba(31,47,61,' + (a || 0.3) + ')'); r.addColorStop(0.6, 'rgba(31,47,61,' + (a || 0.3) * 0.4 + ')');
    r.addColorStop(1, 'rgba(31,47,61,0)');
    g.fillStyle = r; g.beginPath(); g.arc(0, 0, w / 2, 0, TAU); g.fill(); g.restore();
  };

  /* ───── جزء معتم (معدن/بلاستيك) بتدرج أسطواني ───── */
  K.part = function (g, x, y, w, h, r, base, horizontalLight) {
    var vertical = horizontalLight === false;
    var gr = vertical
      ? lg(g, x, y, x, y + h, [[0, rgba(shade(base, 1.12), 1)], [0.25, rgba(shade(base, 1.04), 1)], [0.7, rgba(shade(base, 0.82), 1)], [1, rgba(shade(base, 0.62), 1)]])
      : lg(g, x, y, x + w, y, [[0, rgba(shade(base, 0.72), 1)], [0.18, rgba(shade(base, 1.14), 1)], [0.42, rgba(shade(base, 1.02), 1)], [0.8, rgba(shade(base, 0.8), 1)], [1, rgba(shade(base, 0.6), 1)]]);
    g.fillStyle = gr; g.beginPath(); g.roundRect(x, y, w, h, r); g.fill();
    g.lineWidth = 1; g.strokeStyle = rgba(shade(base, 0.42), 0.75); g.stroke();
    if (h > 8 && w > 8) {                       // لمعة علوية دقيقة
      g.fillStyle = 'rgba(255,255,255,.22)'; g.beginPath();
      g.roundRect(x + 1.5, y + 1, w - 3, Math.min(3, h * 0.2), 1.5); g.fill();
    }
  };

  /* ───── زجاج: pathFn يبني المسار، وshine يحدد اتجاه اللمعة ───── */
  K.glass = function (g, pathFn, x, y, w, h, opts) {
    opts = opts || {};
    pathFn(g);
    g.fillStyle = lg(g, x, 0, x + w, 0, [[0, 'rgba(176,206,224,.50)'], [0.10, 'rgba(255,255,255,.60)'], [0.28, 'rgba(226,241,250,.16)'],
      [0.7, 'rgba(206,228,240,.10)'], [0.9, 'rgba(176,208,226,.34)'], [1, 'rgba(130,168,192,.55)']]);
    g.fill();
    g.lineWidth = 1.5; g.strokeStyle = K.pal.glassEdge; g.stroke();
    var shine = opts.shine || (w > h * 1.6 ? 'ellipse' : 'vertical');
    g.save(); pathFn(g); g.clip(); g.lineCap = 'round';
    g.strokeStyle = 'rgba(255,255,255,.75)';
    if (shine === 'flask') {
      g.lineWidth = Math.max(1.2, Math.min(3.2, w * 0.027));
      g.beginPath();
      g.moveTo(x + w * 0.37, y + h * 0.09);
      g.lineTo(x + w * 0.37, y + h * 0.33);
      g.lineTo(x + w * 0.12, y + h * 0.78);
      g.stroke();
      g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = Math.max(0.8, Math.min(1.6, w * 0.014));
      g.beginPath();
      g.moveTo(x + w * 0.65, y + h * 0.12);
      g.lineTo(x + w * 0.65, y + h * 0.33);
      g.lineTo(x + w * 0.88, y + h * 0.73);
      g.stroke();
    }
    if (shine === 'ellipse') {
      g.lineWidth = Math.max(0.8, Math.min(3, h * 0.07));
      g.beginPath(); g.ellipse(x + w * 0.5, y + h * 0.66, w * 0.39, h * 0.26, 0, Math.PI * 1.12, Math.PI * 1.48); g.stroke();
      g.strokeStyle = 'rgba(255,255,255,.28)'; g.lineWidth = Math.max(0.7, Math.min(1.8, h * 0.04));
      g.beginPath(); g.ellipse(x + w * 0.5, y + h * 0.66, w * 0.44, h * 0.3, 0, Math.PI * 1.62, Math.PI * 1.82); g.stroke();
    } else if (shine === 'horizontal') {
      g.lineWidth = Math.max(0.8, Math.min(2.4, h * 0.16));
      g.beginPath(); g.moveTo(x + w * 0.14, y + h * 0.28); g.lineTo(x + w * 0.72, y + h * 0.28); g.stroke();
      g.strokeStyle = 'rgba(255,255,255,.28)'; g.lineWidth = Math.max(0.6, Math.min(1.4, h * 0.09));
      g.beginPath(); g.moveTo(x + w * 0.34, y + h * 0.72); g.lineTo(x + w * 0.86, y + h * 0.72); g.stroke();
    } else if (shine === 'diagonal') {
      g.lineWidth = Math.max(0.8, Math.min(2.5, w * 0.035));
      g.beginPath(); g.moveTo(x + w * 0.18, y + h * 0.08); g.quadraticCurveTo(x + w * 0.36, y + h * 0.32, x + w * 0.48, y + h * 0.5); g.stroke();
      g.strokeStyle = 'rgba(255,255,255,.28)'; g.lineWidth = Math.max(0.6, Math.min(1.5, w * 0.02));
      g.beginPath(); g.moveTo(x + w * 0.84, y + h * 0.12); g.quadraticCurveTo(x + w * 0.66, y + h * 0.35, x + w * 0.52, y + h * 0.5); g.stroke();
    } else if (shine === 'vertical') {
      g.lineWidth = Math.max(0.7, Math.min(3, w * 0.045));
      g.beginPath(); g.moveTo(x + w * 0.17, y + h * 0.12); g.lineTo(x + w * 0.17, y + h * 0.7); g.stroke();
      g.strokeStyle = 'rgba(255,255,255,.28)'; g.lineWidth = Math.max(0.6, Math.min(1.8, w * 0.02));
      g.beginPath(); g.moveTo(x + w * 0.84, y + h * 0.2); g.lineTo(x + w * 0.84, y + h * 0.62); g.stroke();
    }
    g.restore();
  };

  /* ───── سائل داخل مسار (قص): أفتح في الوسط، أغمق عند الجدار، سطح بيضاوي + تقوّس ───── */
  K.liquid = function (g, pathFn, cx, w, topY, botY, color, surfRy) {
    var ry = surfRy === undefined ? 3.2 : surfRy;
    g.save(); pathFn(g); g.clip();
    g.fillStyle = lg(g, cx - w / 2, 0, cx + w / 2, 0, [[0, rgba(shade(color, 0.7), 0.92)], [0.25, rgba(shade(color, 1.1), 0.82)],
      [0.5, rgba(shade(color, 1.18), 0.76)], [0.8, rgba(shade(color, 0.92), 0.84)], [1, rgba(shade(color, 0.62), 0.94)]]);
    g.fillRect(cx - w / 2 - 2, topY, w + 4, botY - topY + 2);
    g.fillStyle = lg(g, 0, topY, 0, botY, [[0, 'rgba(255,255,255,.10)'], [1, 'rgba(0,0,0,.16)']]);   // تعتيم القاع
    g.fillRect(cx - w / 2 - 2, topY, w + 4, botY - topY + 2);
    g.fillStyle = rgba(shade(color, 1.3), 0.55);                                                    // السطح (Meniscus)
    g.beginPath(); g.ellipse(cx, topY, w / 2 - 1, ry, 0, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 1;
    g.beginPath(); g.ellipse(cx, topY, w / 2 - 1.5, ry, 0, Math.PI * 0.05, Math.PI * 0.95); g.stroke();
    g.restore();
  };

  /* ═════════ الأدوات الزجاجية ═════════ */
  // origin = منتصف القاعدة على الطاولة. opts: level 0..1, color [r,g,b], marks
  K.beaker = function (g, cx, by, s, o) {
    o = o || {}; var w = 112, h = 134, x = -w / 2, y = -h, r = 12, color = o.color || [78, 150, 205];
    g.save(); g.translate(cx, by); g.scale(s, s);
    K.contactShadow(g, 0, 1, w * 1.05, 0.32);
    function path(g2) { g2.beginPath(); g2.moveTo(x, y); g2.lineTo(x, y + h - r); g2.arcTo(x, y + h, x + r, y + h, r);
      g2.lineTo(x + w - r, y + h); g2.arcTo(x + w, y + h, x + w, y + h - r, r); g2.lineTo(x + w, y); }
    g.fillStyle = 'rgba(210,228,240,.18)'; g.beginPath(); g.ellipse(0, y, w / 2, 5, 0, 0, TAU); g.fill();    // فتحة خلفية
    if (o.level > 0) K.liquid(g, path, 0, w - 4, y + h - (h - 14) * o.level, y + h, color, 4);
    K.glass(g, path, x, y, w, h);
    g.strokeStyle = K.pal.glassEdge; g.lineWidth = 1.8; g.beginPath(); g.ellipse(0, y, w / 2, 5, 0, 0, TAU); g.stroke();
    if (o.marks !== false) {                                                                                  // تدريج
      g.strokeStyle = 'rgba(31,47,61,.6)'; g.lineWidth = 1.2;
      for (var i = 1; i <= 5; i++) { var ty = y + h - 12 - i * ((h - 34) / 5), long_ = (i % 2 === 1);
        g.beginPath(); g.moveTo(x + w - 3, ty); g.lineTo(x + w - (long_ ? 24 : 15), ty); g.stroke(); }
    }
    g.restore();
  };

  // origin = منتصف القاعدة (الأنبوب واقف في حامل). opts: level, color, cap(bool)
  K.testTube = function (g, cx, by, s, o) {
    o = o || {}; var w = 28, h = 150, x = -w / 2, y = -h, r = w / 2, color = o.color || [200, 70, 70];
    g.save(); g.translate(cx, by); g.scale(s, s);
    K.contactShadow(g, 0, 1, w * 1.6, 0.25);
    function path(g2) { g2.beginPath(); g2.moveTo(x, y); g2.lineTo(x, y + h - r); g2.arc(0, y + h - r, r, Math.PI, 0, true); g2.lineTo(x + w, y); }
    if (o.level > 0) K.liquid(g, path, 0, w - 2, y + h - (h - 30) * o.level, y + h, color, 2.4);
    K.glass(g, path, x, y, w, h);
    g.strokeStyle = K.pal.glassEdge; g.lineWidth = 2.2; g.beginPath(); g.ellipse(0, y, w / 2 + 1.5, 3, 0, 0, TAU); g.stroke();   // حلقة الفوهة
    if (o.cap) { K.part(g, x - 2, y - 14, w + 4, 16, 4, o.capColor || [47, 111, 143]);
      g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 1; for (var i = 1; i < 5; i++) { g.beginPath(); g.moveTo(x - 1 + i * (w + 2) / 5, y - 12); g.lineTo(x - 1 + i * (w + 2) / 5, y - 1); g.stroke(); } }
    g.restore();
  };

  // دورق إرلنماير. origin = منتصف القاعدة
  K.flask = function (g, cx, by, s, o) {
    o = o || {}; var bw = 128, nw = 38, h = 168, nh = 56, color = o.color || [92, 180, 140];
    g.save(); g.translate(cx, by); g.scale(s, s);
    K.contactShadow(g, 0, 1, bw * 1.05, 0.3);

  if (tool.id === 'dropper') { ok = tryStep('add'); if (ok) state.beakerLevel = 0.6; }
  if (tool.id === 'stirrer') { ok = tryStep('mix'); if (ok) state.mixed = true; }
  sendHome(tool);                                   // الأداة تعود لجيبها بعد الاستخدام
  return true;
}

/* ───────── 7. الرسم (طبقات مخزّنة + عناصر ديناميكية) ───────── */
var layers = {};
function makeLayer(w, h, dpr) {
  var c = document.createElement('canvas'); c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  var g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); return { c: c, g: g };
}
var benchTy = 0;
function beakerBaseY() { return benchTy + (H - benchTy) * 0.5; }
function drawShelf(g, shelf, y, scale) {
  g.save();
  [shelf.x + 30 * scale, shelf.x + shelf.width - 30 * scale].forEach(function (supportX) {
    g.fillStyle = '#9aa6aa';
    g.fillRect(supportX - 2 * scale, y + 38 * scale, 4 * scale, 17 * scale);
  });
  Kit.part(g, shelf.x, y + 26 * scale, shelf.width, 15 * scale, 4 * scale, [160, 132, 98], false);
  Kit.part(g, shelf.x + 3 * scale, y + 26 * scale, shelf.width - 6 * scale, 4 * scale, 2 * scale, [193, 167, 130], false);
  var tagWidth = Math.min(110 * scale, shelf.width - 20 * scale);
  var tagHeight = 20 * scale, tagX = shelf.x + (shelf.width - tagWidth) / 2, tagY = y + 29 * scale;
  g.fillStyle = '#f8f6ed';
  g.strokeStyle = '#9a8b70';
  g.lineWidth = Math.max(0.7, scale);
  g.roundRect(tagX, tagY, tagWidth, tagHeight, 2 * scale);
  g.fill(); g.stroke();
  g.fillStyle = '#4c565a';
  g.font = 'bold ' + Math.max(9, 12 * scale) + 'px sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(shelf.label, shelf.x + shelf.width / 2, tagY + tagHeight / 2, tagWidth - 16 * scale);
  g.fillStyle = '#879398';
  [tagX + 5 * scale, tagX + tagWidth - 5 * scale].forEach(function (screwX) {
    g.beginPath();
    g.arc(screwX, tagY + tagHeight / 2, 1.3 * scale, 0, Math.PI * 2);
    g.fill();
  });
  g.restore();
}
function drawWorkbenchDetails(g) {
  var geometry = shelfGeometry(), scale = geometry.scale, y = geometry.y;
  var shelves = geometry.shelves, compact = W < 600;
  shelves.forEach(function (shelf) { drawShelf(g, shelf, y, scale); });

  var stockY = y + 25 * scale;
  Kit.bottle(g, shelves[0].x + shelves[0].width * (compact ? 0.24 : 70 / 275), stockY, 0.60 * scale, {color:[55,145,205], level:0.68, label:'أ'});
  Kit.bottle(g, shelves[0].x + shelves[0].width * (compact ? 0.50 : 150 / 275), stockY, 0.60 * scale, {color:[194,126,48], level:0.74, label:'ب'});
  Kit.bottle(g, shelves[0].x + shelves[0].width * (compact ? 0.76 : 230 / 275), stockY, 0.60 * scale, {color:[112,165,102], level:0.58, label:'ج'});
  Kit.beaker(g, shelves[1].x + shelves[1].width * (compact ? 0.19 : 68 / 360), stockY, 0.56 * scale, {level:0.24,color:[77,151,203]});
  Kit.flask(g, shelves[1].x + shelves[1].width * (compact ? 0.46 : 165 / 360), stockY, 0.48 * scale, {level:0.32,color:[94,177,142]});
  var rackX = shelves[1].x + shelves[1].width * (compact ? 0.78 : 285 / 360);
  var rackScale = 0.48 * scale;
  var slots = Kit.tubeRack(g, rackX, stockY, rackScale, {n:3,spacing:38,color:[47,111,143]});
  slots.forEach(function (offset, i) {
    Kit.testTube(g, rackX + offset * rackScale, stockY - 14 * rackScale, rackScale, {
      level:0.35 + i * 0.14, color:i === 1 ? [77,151,203] : [92,177,142]
    });
  });
  Kit.tubeRack(g, rackX, stockY, rackScale, {n:3,spacing:38,color:[47,111,143],front:true});
  Kit.thermometer(g, shelves[2].x + shelves[2].width * 0.82, stockY, 0.34 * scale, {temp:24});

  var frontEdgeY = H - 15 * scale;
  g.save();
  g.beginPath();
  g.rect(0, benchTy + 10 * scale, W, Math.max(0, frontEdgeY - benchTy - 10 * scale));
  g.clip();
  g.strokeStyle = 'rgba(77,96,106,.025)';
  g.lineWidth = 1;
  for (var grainY = benchTy + 28 * scale; grainY < frontEdgeY; grainY += 34 * scale) {
    g.beginPath();
    g.moveTo(0, grainY);
    g.bezierCurveTo(W * 0.25, grainY - 3 * scale, W * 0.68, grainY + 3 * scale, W, grainY);
    g.stroke();
  }
  g.restore();
  g.fillStyle = 'rgba(77,96,106,.16)';
  g.fillRect(0, frontEdgeY - 2 * scale, W, 3 * scale);
  var frontEdge = g.createLinearGradient(0, frontEdgeY, 0, H);
  frontEdge.addColorStop(0, '#b3c1c7');
  frontEdge.addColorStop(0.25, '#a8b8bf');
  frontEdge.addColorStop(1, '#96a8b0');
  g.fillStyle = frontEdge;
  g.fillRect(0, frontEdgeY, W, H - frontEdgeY);
  g.fillStyle = 'rgba(255,255,255,.55)';
  g.fillRect(0, frontEdgeY, W, Math.max(1, scale));
}
function rebuildStaticLayers() {
  var L = makeLayer(W, H, DPR);
  var tableEdgeY = Math.max(SAFE_TOP, H * 0.72);
  var edgeRatio = clamp((tableEdgeY - SAFE_TOP) / Math.max(1, H - SAFE_TOP), 0, 1);
  benchTy = Kit.bench(L.g, W, H, SAFE_TOP, edgeRatio);
  drawWorkbenchDetails(L.g);
  layers.bench = L;
}

function drawTool(g, t) {
  g.save();
  if (t.dragging) { g.globalAlpha = 0.97; }
  var toolScale = U * (t.drawScale || 1);
  var tipX = t.x, tipY = t.y + t.tipY * toolScale;
  if (t.id === 'dropper') Kit.dropper(g, tipX, tipY, toolScale, { liquid: [80, 140, 200], fill: state.beakerLevel > 0 ? 0 : 0.6 });
  else Kit.stirrer(g, tipX, tipY, toolScale);
  g.restore();
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  if (layers.bench) ctx.drawImage(layers.bench.c, 0, 0, W, H);
  if (state.scene === 'bench') {
    Kit.beaker(ctx, W * 0.5, beakerBaseY(), U, { level: state.beakerLevel, color: state.mixed ? [80, 170, 150] : [80, 140, 200] });
  }
  tools.forEach(function (t) { if (isVisible(t) && !t.dragging) drawTool(ctx, t); });
  tools.forEach(function (t) { if (isVisible(t) && t.dragging) drawTool(ctx, t); });   // المسحوب فوق الكل
  targets.forEach(function (g) {
    if (isVisible(g) && g.hover) {
      ctx.save(); ctx.strokeStyle = 'rgba(47,111,143,.8)'; ctx.setLineDash([6, 5]); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(g.x(), g.y(), g.r(), 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }
  });
}

/* ───────── 8. حلقة الرسم عند الحاجة فقط ───────── */
var dirty = true, raf = 0;
function invalidate() { dirty = true; if (!raf) raf = requestAnimationFrame(frame); }
function frame(now) {
  raf = 0;
  var busy = stepAnims(now);
  if (dirty || busy) { dirty = false; draw(); }
  if (busy) invalidate();
}
document.addEventListener('visibilitychange', function () { if (!document.hidden) invalidate(); });

/* ───────── 9. السحب والإفلات (مؤشر واحد) ───────── */
var activeId = null, active = null, off = { x: 0, y: 0 };
function pt(e) { var r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
var toolTooltip = $('tool-tooltip');
function findHoverItemAt(p) {
  if (state.scene === 'bench') {
    var beakerX = W * 0.5, beakerY = beakerBaseY();
    if (p.x >= beakerX - 58 * U && p.x <= beakerX + 58 * U &&
        p.y >= beakerY - 150 * U && p.y <= beakerY + 8 * U) return { id: 'beaker' };
  }
  for (var i = tools.length - 1; i >= 0; i--) {
    var t = tools[i];
    if (!isVisible(t) || t.dragging || t.anim) continue;
    var toolScale = U * (t.drawScale || 1);
    var top = t.y - (t.id === 'dropper' ? 78 : 75) * toolScale;
    var bottom = t.y + t.tipY * toolScale;
    if (p.x >= t.x - 20 * toolScale && p.x <= t.x + 20 * toolScale && p.y >= top && p.y <= bottom) return t;
  }
  return null;
}
function updateHoverTooltip(item, p) {
  if (!item) {
    toolTooltip.classList.remove('visible');
    toolTooltip.setAttribute('aria-hidden', 'true');
    return;
  }
  toolTooltip.textContent = T[item.id];
  toolTooltip.setAttribute('aria-hidden', 'false');
  toolTooltip.classList.add('visible');
  var margin = 8, offset = 14, tooltipRect = toolTooltip.getBoundingClientRect();
  var left = clamp(p.x + offset, margin, W - tooltipRect.width - margin);
  var top = p.y - tooltipRect.height - offset;
  if (top < margin) top = Math.min(H - tooltipRect.height - margin, p.y + offset);
  toolTooltip.style.left = left + 'px';
  toolTooltip.style.top = top + 'px';
}

cv.addEventListener('pointerdown', function (e) {
  if (activeId !== null) return;
  var p = pt(e);
  for (var i = tools.length - 1; i >= 0; i--) {
    var t = tools[i];
    if (!isVisible(t) || t.anim) continue;
    var toolScale = U * (t.drawScale || 1);
    var grabY = t.y + t.tipY * toolScale * 0.5;
    if (Math.hypot(p.x - t.x, p.y - grabY) <= t.r) {
      active = t; activeId = e.pointerId; t.dragging = true;
      updateHoverTooltip(null);
      off.x = p.x - t.x; off.y = p.y - t.y;
      cv.setPointerCapture(e.pointerId); invalidate(); return;
    }
  }
});
cv.addEventListener('pointermove', function (e) {
  var p = pt(e);
  if (!active || e.pointerId !== activeId) {
    if (e.pointerType !== 'touch') updateHoverTooltip(findHoverItemAt(p), p);
    return;
  }
  active.x = clamp(p.x - off.x, active.r, W - active.r);
  var toolScale = U * (active.drawScale || 1);
  active.y = clamp(p.y - off.y, SAFE_TOP + active.halfH * toolScale, H - active.tipY * toolScale - 4);   // لا تحت شريط المشغّل ولا خارج الطاولة
  targets.forEach(function (g) {
    g.hover = isVisible(g) && g.accepts === active.id && Math.hypot(active.x - g.x(), (active.y + active.tipY * toolScale) - g.y()) <= g.r();   // الفحص عند طرف الأداة
  });
  invalidate();
});
function endDrag(e, cancel) {
  if (!active || e.pointerId !== activeId) return;
  var t = active, hit = null;
  active = null; activeId = null; t.dragging = false;
  updateHoverTooltip(null);
  try { cv.releasePointerCapture(e.pointerId); } catch (_) {}
  targets.forEach(function (g) { if (g.hover && !cancel) hit = g; g.hover = false; });
  if (hit) onDrop(t, hit); else sendHome(t);
  invalidate();
}
cv.addEventListener('pointerup', function (e) { endDrag(e, false); });
cv.addEventListener('pointercancel', function (e) { endDrag(e, true); });
cv.addEventListener('pointerleave', function (e) {
  if (!active && e.pointerType !== 'touch') updateHoverTooltip(null);
});

/* ───────── 10. إعادة التجربة (تعيد كل شيء) ───────── */
function resetAll() {
  stepIdx = 0; state.scene = 'bench'; state.beakerLevel = 0; state.mixed = false;
  active = null; activeId = null; hint('');
  updateHoverTooltip(null);
  tools.forEach(function (t) { t.dragging = false; t.anim = null; t.x = t.slotX; t.y = t.slotY; });
  targets.forEach(function (g) { g.hover = false; });
  renderSidebar(); rebuildStaticLayers(); invalidate();
}
$('rst').addEventListener('click', resetAll);
$('next').addEventListener('click', function () {
  if (stepIdx >= steps.length) return;
  stepIdx++; hint(''); renderSidebar();
});

/* ───────── 11. الإقلاع ───────── */
if ('ResizeObserver' in window) new ResizeObserver(resize).observe(stage);
else window.addEventListener('resize', resize);
resize(); renderSidebar();
})();
</script>
